<!-- Script Handling Tab Switching & Password Toggle -->
<script>
function switchTab(tabName) {
['email', 'phone', 'code', 'social'].forEach(name => {
document.getElementById('form-' + name).classList.add('hidden');
document.getElementById('tab-' + name).classList.remove('active');
});
document.getElementById('form-' + tabName).classList.remove('hidden');
document.getElementById('tab-' + tabName).classList.add('active');
}

function togglePassword(inputId, eyeId) {
const input = document.getElementById(inputId);
const eye = document.getElementById(eyeId);
if (input.type === 'password') {
input.type = 'text';
eye.classList.remove('fa-eye-slash');
eye.classList.add('fa-eye');
} else {
input.type = 'password';
eye.classList.remove('fa-eye');
eye.classList.add('fa-eye-slash');
}
}
</script>
